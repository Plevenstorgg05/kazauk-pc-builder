name: Test and publish KAZAUK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check protected source
        run: python3 scripts/verify-configurator-protection.py docs/protected-source-hashes.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static export
        run: node scripts/build-github-pages.mjs
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: npx playwright install --with-deps chromium
      - name: Test the Pages export
        run: |
          node scripts/serve-github-pages.mjs > /tmp/kazauk-pages-preview.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail "$PAGES_TEST_URL" --output /dev/null
          npx playwright test --config=playwright.pages.config.ts --workers=2
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_TEST_URL: http://localhost:3001${{ steps.pages.outputs.base_path }}/
      - name: Verify source after build
        run: python3 scripts/verify-configurator-protection.py docs/protected-source-hashes.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
